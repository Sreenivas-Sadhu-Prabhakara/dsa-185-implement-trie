<rect x="1.0" y="1.0" width="758.0" height="455.0" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.2"/>
<text x="24.0" y="34.0" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="17" fill="#1e293b" text-anchor="start" font-weight="600">Trie — one letter per edge, a flag where words end</text>
<circle cx="35.0" cy="74.0" r="11" fill="#2563eb" stroke="#2563eb" stroke-width="1.4"/>
<text x="35.0" y="78.5" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="600">1</text>
<text x="56.0" y="79.0" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13.5" fill="#1e293b" text-anchor="start">Insert "apple": each character descends one level, creating nodes as needed; the</text>
<text x="56.0" y="98.0" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13.5" fill="#1e293b" text-anchor="start">last node gets an END flag (apple ✓, but "app" is only a path, not a word).</text>
<rect x="24.0" y="114.0" width="54.0" height="36.0" rx="6" fill="#eef2f7" stroke="#94a3b8" stroke-width="1.2"/>
<text x="51.0" y="137.0" font-family="ui-monospace,Menlo,monospace" font-size="14" fill="#1e293b" text-anchor="middle">•</text>
<line x1="78.0" y1="132.0" x2="102.0" y2="132.0" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#arr)"/>
